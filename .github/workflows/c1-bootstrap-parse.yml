name: Capagross RX18 local-sync bootstrap validation

on:
  push:
    branches: [c1]
    paths:
      - c.ps1
      - auto.ps1
      - .github/workflows/c1-bootstrap-parse.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse-on-windows:
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose published raw auto.ps1 SHA256
        shell: powershell
        run: |
          $bootstrap = Get-Content c.ps1 -Raw
          $urlLine = $bootstrap.Split([char]10) | Where-Object { $_.Contains('$autoUrl = ') } | Select-Object -First 1
          $hashLine = $bootstrap.Split([char]10) | Where-Object { $_.Contains('$autoHash = ') } | Select-Object -First 1
          $url = ($urlLine -split "'")[1]
          $expected = ($hashLine -split "'")[1]
          if (-not $url -or -not $expected) { throw 'Missing pinned helper URL or hash' }
          $rawFile = Join-Path $env:TEMP 'capagross-raw-helper.ps1'
          Invoke-WebRequest -Uri $url -UseBasicParsing -OutFile $rawFile -TimeoutSec 25 -ErrorAction Stop
          $actual = (Get-FileHash $rawFile -Algorithm SHA256).Hash
          Write-Host ("REMOTE_AUTO_SHA256=" + $actual)
          Write-Host ("PINNED_AUTO_SHA256=" + $expected)
          Write-Host ("REMOTE_AUTO_BYTES=" + (Get-Item $rawFile).Length)
          Write-Host ("CHECKOUT_AUTO_SHA256=" + (Get-FileHash auto.ps1 -Algorithm SHA256).Hash)
          Write-Host ("REMOTE_PIN_MATCH=" + ($actual -eq $expected))
          if ($actual -ne $expected) { throw 'Raw GitHub helper SHA256 differs from pinned bootstrap hash' }
          $candidate = Join-Path $env:TEMP 'capagross-fixed-spa-helper.ps1'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/ruggeropaolobasile/ruggero/6bbfbd85cae5672d37e9a00bb3c503a6c8f2a52f/auto.ps1' -UseBasicParsing -OutFile $candidate -TimeoutSec 25 -ErrorAction Stop
          Write-Host ('FIXED_SPA_RAW_SHA256=' + (Get-FileHash $candidate -Algorithm SHA256).Hash)
          Write-Host ('FIXED_SPA_RAW_BYTES=' + (Get-Item $candidate).Length)
      - name: Parse PowerShell 5.1 and verify local-sync entrypoints
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $source = (Resolve-Path 'c.ps1').Path
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($source, [ref]$tokens, [ref]$errors)
          if ($errors.Count) {
            foreach ($e in $errors) { Write-Error $e.Message }
            exit 1
          }
          if (-not $ast) { throw 'No PowerShell AST' }
          $sourceText = Get-Content -LiteralPath $source -Raw
          foreach ($feature in @('Stage-SyncedFiles', 'Get-SyncRoots', 'Test-VerifiedFile', 'Dropbox', 'MUSICA - Production')) {
            if (-not $sourceText.Contains($feature)) { throw "Missing feature: $feature" }
          }
          # Regression: PowerShell treats $home as the read-only automatic $HOME.
          $forbidden = @('HOME', 'HOST', 'PID', 'PSVERSIONTABLE', 'NULL', 'TRUE', 'FALSE')
          $assignments = $ast.FindAll({
            param($node)
            $node -is [System.Management.Automation.Language.AssignmentStatementAst]
          }, $true)
          foreach ($assignment in $assignments) {
            $lhs = $assignment.Left
            if ($lhs -is [System.Management.Automation.Language.VariableExpressionAst]) {
              $name = $lhs.VariablePath.UserPath.ToUpperInvariant()
              if ($forbidden -contains $name) {
                throw "Attempted assignment to readonly automatic variable `$name at line $($lhs.Extent.StartLineNumber)"
              }
            }
          }
          # Execute only the safe, bounded local root-discovery function, not the recording main.
          $functionNode = $ast.FindAll({
            param($node)
            $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
              $node.Name -eq 'Get-SyncRoots'
          }, $true) | Select-Object -First 1
          if (-not $functionNode) { throw 'Get-SyncRoots function missing' }
          . ([scriptblock]::Create($functionNode.Extent.Text))
          $roots = @(Get-SyncRoots)
          Write-Host "GET-SYNCROOTS-RUNTIME-OK roots=$($roots.Count)"
          # Simulate an offline Google Drive virtual folder raising an IOException.
          # Must be non-fatal and continue to other roots.
          function Test-Path {
            [CmdletBinding()]
            param([string]$LiteralPath, [string]$PathType)
            if ($LiteralPath -match 'Google Drive') {
              throw [System.IO.IOException]::new('Virtual Google Drive path unavailable')
            }
            return (Microsoft.PowerShell.Management\Test-Path -LiteralPath $LiteralPath -PathType $PathType -ErrorAction SilentlyContinue)
          }
          $offlineRoots = @(Get-SyncRoots)
          Remove-Item Function:\Test-Path -Force
          if ($null -eq $offlineRoots) { throw 'Offline paths abort the root discovery' }
          Write-Host "DRIVE-OFFLINE-REGRESSION-PASS roots=$($offlineRoots.Count)"
          foreach ($functionName in @('Get-SyncedLogDirectories', 'Publish-RunLogs')) {
            $functionAst = $ast.FindAll({
              param($node)
              $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
                $node.Name -eq $functionName
            }, $true) | Select-Object -First 1
            if (-not $functionAst) { throw "Function not found: $functionName" }
            . ([scriptblock]::Create($functionAst.Extent.Text))
          }
          $testRoot = Join-Path $env:TEMP ('CapagrossLogSyncTest-' + $PID)
          $testDrive = Join-Path $testRoot 'My Drive\MUSICA - Production'
          $testShared = Join-Path $testRoot 'Dropbox\sharedrx18'
          New-Item -ItemType Directory -Path $testDrive,$testShared -Force | Out-Null
          try {
            $targets = @(Get-SyncedLogDirectories @($testDrive))
            if ($targets.Count -ne 1) { throw "Expected one private Drive target, got $($targets.Count)" }
            $sharedTargets = @(Get-SyncedLogDirectories @($testShared))
            if ($sharedTargets.Count -ne 0) { throw 'Refusing shared Dropbox path regression failed' }
            $sourceLog = Join-Path $testRoot 'full.log'
            $sourceStatus = Join-Path $testRoot 'status.json'
            $logText = ('BOOTSTRAP RUN' + [Environment]::NewLine + 'CAPTURE FAILED' + [Environment]::NewLine + 'ERROR: test audio device missing')
            Set-Content -LiteralPath $sourceLog -Value $logText -Encoding UTF8
            Set-Content -LiteralPath $sourceStatus -Value '{"status":"failed","phase":"audio_capture"}' -Encoding UTF8
            $published = @(Publish-RunLogs -sourceLog $sourceLog -sourceStatus $sourceStatus -targets $targets)
            if ($published.Count -ne 1) { throw 'Log was not published to Drive sync folder' }
            $latest = Join-Path $targets[0] 'Capagross-RX18-LATEST.log'
            $latestStatus = Join-Path $targets[0] 'Capagross-RX18-LATEST.json'
            if (-not (Test-Path -LiteralPath $latest -PathType Leaf)) { throw 'Latest log missing' }
            if (-not (Test-Path -LiteralPath $latestStatus -PathType Leaf)) { throw 'Latest status missing' }
            if ((Get-Content -LiteralPath $latest -Raw) -notmatch 'ERROR: test audio device missing') { throw 'Full error lost during sync' }
            if ((Get-Content -LiteralPath $latestStatus -Raw) -notmatch '"failed"') { throw 'Failure status lost during sync' }
            Write-Host 'CAPAGROSS-LOG-SYNC-TEST-PASS'
          } finally {
            Remove-Item -LiteralPath $testRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
          Write-Host 'C1-LOCAL-SYNC-BOOTSTRAP-PARSE-OK'
      - name: Validate unattended CDP orchestrator (PowerShell 5.1)
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'auto.ps1').Path, [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -gt 0) {
            foreach ($e in $errors) { Write-Error $e.Message }
            exit 1
          }
          if (-not $ast) { throw 'CDP helper source AST missing' }
          $source = Get-Content -LiteralPath 'auto.ps1' -Raw
          foreach ($required in @(
            '127.0.0.1:9222',
            '133f9e23-e0f3-4acf-b95b-934c37cb125c',
            'WASAPI_CAPTURE_READY',
            'Input.dispatchMouseEvent',
            'AUDIO_CAPTURE_EXIT_',
            'CAPAGROSS_MP3_CREATED'
          )) {
            if (-not $source.Contains($required)) { throw ('CDP helper missing required guard: ' + $required) }
          }
          $bootstrap = Get-Content -LiteralPath 'c.ps1' -Raw
          if (-not $bootstrap.Contains('AUTOCAPTURE_SCRIPT_SHA256_MISMATCH')) { throw 'Unverified helper download' }
          if (-not $bootstrap.Contains('CDP_AUTOMATION: capture starts first')) { throw 'Autonomous step not active' }
          # Unit test the exact Get-SongTab function against the Windows 5.1 nested-array case.
          $node = $ast.FindAll({
            param($n)
            $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq 'Get-SongTab'
          }, $true) | Select-Object -First 1
          if (-not $node) { throw 'Get-SongTab function not found' }
          . ([scriptblock]::Create($node.Extent.Text))
          $cdpBase = 'http://127.0.0.1:9222'
          $songId = '133f9e23-e0f3-4acf-b95b-934c37cb125c'
          $goodTab = [pscustomobject]@{
            type='page'
            url=('https://suno.com/song/' + $songId)
            webSocketDebuggerUrl='ws://127.0.0.1:9222/devtools/page/test'
          }
          $badTab = [pscustomobject]@{
            type='page'
            url='https://suno.com/song/unrelated'
            webSocketDebuggerUrl='ws://127.0.0.1:9222/devtools/page/other'
          }
          function Invoke-RestMethod { return @($badTab, $goodTab) }
          $found = Get-SongTab
          if ($null -eq $found -or $found -is [array]) { throw 'CDP tabs were returned as an array' }
          if ($found.url -ne $goodTab.url) { throw 'Wrong Suno tab returned' }
          $wsUri = [System.Uri]::new([string]$found.webSocketDebuggerUrl)
          if ($wsUri.Host -ne '127.0.0.1' -or $wsUri.Port -ne 9222) { throw 'Invalid CDP URI' }
          Remove-Item Function:\Invoke-RestMethod -Force
          $rootTab = [pscustomobject]@{
            type='page'
            url='https://suno.com'
            webSocketDebuggerUrl='ws://127.0.0.1:9222/devtools/page/spa-root'
          }
          function Invoke-RestMethod { return @($rootTab) }
          $rootMatch=Get-SongTab
          if ($null -eq $rootMatch -or $rootMatch.url -ne 'https://suno.com') {
            throw 'Suno SPA root did not match the authenticated song tab'
          }
          Remove-Item Function:\Invoke-RestMethod -Force
          if ($source -notmatch 'SONG_TITLE_MISMATCH') { throw 'Suno SPA title guard is missing' }
          if ($bootstrap -notmatch 'Capagross-RX18-CDP-') { throw 'Nested PowerShell diagnostics are not logged' }
          Write-Host 'CDP-ROOT-SPA-TAB-PASS'
          Write-Host 'CDP-URI-SCALAR-REGRESSION-OK'
          Write-Host ('AUTOCAPTURE-SHA256=' + (Get-FileHash -LiteralPath 'auto.ps1' -Algorithm SHA256).Hash)
          Write-Host 'CAPAGROSS-CDP-AUTO-PARSE-OK'
      - name: Integration test - failed run must publish full log to Drive
        shell: powershell
        run: |
          $testDrive = Join-Path $env:TEMP ('capagross-failure-' + $PID + '\My Drive\MUSICA - Production')
          New-Item -ItemType Directory -Path $testDrive -Force | Out-Null
          $env:CAPAGROSS_TEST_DRIVE = $testDrive
          $source = Get-Content c.ps1 -Raw
          $needleRoot = '    $syncDirs = @(Get-SyncRoots)'
          $needleFail = '    Stage-SyncedFiles $syncDirs'
          if (-not $source.Contains($needleRoot) -or -not $source.Contains($needleFail)) { throw 'Integration test anchors moved' }
          $patched = $source.Replace($needleRoot,'    $syncDirs = @($env:CAPAGROSS_TEST_DRIVE)')
          $patched = $patched.Replace($needleFail, "    throw 'EXPECTED_TEST_FAILURE'")
          $simulated = Join-Path $env:TEMP ('capagross-simulated-' + $PID + '.ps1')
          [System.IO.File]::WriteAllText($simulated, $patched)
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $simulated
          $childExit = $LASTEXITCODE
          if ($childExit -eq 0) { throw 'Injected failure returned exit 0' }
          $syncDir = Join-Path $testDrive 'Capagross-RX18-Logs'
          $latestLog = Join-Path $syncDir 'Capagross-RX18-LATEST.log'
          $latestJson = Join-Path $syncDir 'Capagross-RX18-LATEST.json'
          if (-not (Test-Path $latestLog -PathType Leaf)) { throw 'Failed run did not sync full log' }
          if (-not (Test-Path $latestJson -PathType Leaf)) { throw 'Failed run did not sync status JSON' }
          $text = Get-Content -LiteralPath $latestLog -Raw
          if ($text -notmatch 'EXPECTED_TEST_FAILURE' -or $text -notmatch 'Status: FAILED') { throw 'Full log lacks failure details' }
          $status = Get-Content -LiteralPath $latestJson -Raw | ConvertFrom-Json
          if ($status.status -ne 'failed' -or $status.phase -ne 'stage_audio') { throw 'Failed status JSON invalid' }
          Write-Host "CAPAGROSS-END-TO-END-FAILURE-LOG-OK bytes=$((Get-Item $latestLog).Length)"
          # PowerShell caller inherits expected nonzero native LASTEXITCODE; reset for CI test itself.
          $global:LASTEXITCODE = 0
